<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241046">
  <title>Traffic Color Sort</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dégradés SVG partagés par tous les véhicules (rempli par script.js) -->
  <svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>

  <!-- Écran de chargement : retiré par script.js quand tout est prêt -->
  <div id="splash"><div>
    <div class="logo">🚦🚗</div><h1>Traffic Color Sort</h1><p>Chargement de la ville…</p>
    <div class="pbar"><i id="splashBar"></i></div>
  </div></div>

  <div id="app" data-s="home">

    <!-- ================= EN-TÊTE PERMANENT ================= -->
    <header id="hud">
      <button class="avatar press" id="avatarBtn" aria-label="Profil"><span id="avatarArt"></span><i id="avLvl">1</i></button>
      <div class="chip bills"><b>💵</b><span id="bills">0</span><em class="press" data-go="shop">+</em></div>
      <div class="chip lives"><b>❤️</b><span id="lives">5</span><small id="lifeT"></small></div>
      <div class="chip streak" id="chipStreak" title="Série de victoires"><b>🔥</b><span id="streak">0</span></div>
      <button class="gear press" id="gearBtn" aria-label="Paramètres">⚙️</button>
    </header>

    <!-- ================= ÉCRAN CLASSEMENT ================= -->
    <section id="ranking" class="screen sub">
      <h2 class="stitle">🏆 CLASSEMENT</h2>
      <div class="lbtabs">
        <button class="tab press on" data-scope="fr">🇫🇷 National</button>
        <button class="tab press" data-scope="world">🌍 Mondial</button>
      </div>
      <div id="rankList"></div>
    </section>

    <!-- ================= ÉCRAN ACCUEIL = ROUTE DES SAISONS ================= -->
    <section id="home" class="screen sub">
      <h2 class="stitle">🗺️ ROUTE DES SAISONS</h2>
      <div id="road"></div>
      <button class="play press" id="playFab">▶ NIVEAU 1</button>
    </section>

    <!-- ================= ÉCRAN BOUTIQUE ================= -->
    <section id="shop" class="screen sub">
      <h2 class="stitle">🛒 BOUTIQUE</h2>
      <div class="cards" id="shopBox"></div>
    </section>

    <!-- ================= ÉCRAN DE JEU ================= -->
    <section id="game" class="screen">
      <div class="gtop">
        <button class="gbtn press" id="btnHome" aria-label="Retour">🏠</button>
        <div class="pill" id="lvl">NIVEAU 1</div>
        <div class="pill" id="moves">0 coup</div>
        <div class="pill" id="gcoins">⏱ 0 s</div>
      </div>
      <div id="stage"><div id="board"></div></div>
      <div class="bot">
        <button class="btn press" id="btnUndo">↶<small>ANNULER</small><i class="cnt" id="cntUndo">3</i></button>
        <button class="btn press" id="btnHint">💡<small>INDICE</small><i class="cnt" id="cntHint">3</i></button>
        <button class="btn press" id="btnRestart">🔁<small>RECOMMENCER</small></button>
      </div>
    </section>

    <!-- ================= BARRE DE NAVIGATION INFÉRIEURE ================= -->
    <nav id="nav">
      <button class="nb press" data-go="ranking"><i>🏆</i><span>Classement</span></button>
      <button class="nb mid press" data-go="home"><i>🗺️</i><span>Accueil</span></button>
      <button class="nb press" data-go="shop"><i>🛒</i><span>Boutique</span></button>
    </nav>

    <!-- Conteneur des fenêtres (profil, paramètres, victoire, défaite…) -->
    <div id="modal" class="hidden"></div>
    <div id="toast"></div>
  </div>

  <!-- ORDRE DE CHARGEMENT : chaque fichier ne dépend que de ceux qui le précèdent -->
  <script src="levels.js"></script>
  <script src="economy.js"></script>
  <script src="seasons.js"></script>
  <script src="script.js"></script>
  <script>
    /* Filet de sécurité : si le jeu ne démarre pas, on le dit au lieu de rester bloqué sur le chargement. */
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s && !window.__tcsBooted) s.querySelector('p').textContent = '⚠️ Le jeu n\'a pas pu démarrer : un fichier est manquant ou contient une erreur (ouvre la console du navigateur).';
    }, 6000);
  </script>
</body>
</html>
