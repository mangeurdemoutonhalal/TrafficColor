<!-- CodePen : colle UNIQUEMENT le contenu du <body> dans le panneau HTML,
     style.css dans CSS et script.js dans JS. -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Traffic Color Sort</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dégradés + effets partagés par tous les véhicules (rempli par script.js) -->
  <svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>

  <div id="app">
    <header class="top">
      <div class="pill" id="lvl">NIVEAU 1</div>
      <div class="pill" id="moves">0 coup</div>
      <div class="pill" id="time">00:00</div>
    </header>

    <main id="stage"><div id="board"></div></main>

    <footer class="bot">
      <button class="btn" id="btnUndo">↶<small>ANNULER</small></button>
      <button class="btn" id="btnHint">💡<small>INDICE</small></button>
      <button class="btn" id="btnRestart">🔁<small>RECOMMENCER</small></button>
    </footer>

    <div id="win" class="hidden">
      <div class="card">
        <h2>Niveau terminé ! 🎉</h2>
        <p id="winInfo"></p>
        <button class="btn next" id="btnNext">Niveau suivant ▶</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
